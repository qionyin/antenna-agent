  approval_abandoned_after_timeouts: 3

retrieval:
  l2_final_top_k: 5
  l3_workflow_top_k: 5
  l2_min_relevance_score: 0.51
  l3_min_relevance_score: 0.51
  query_expansion:
    enabled: true
    max_variants: 5
    use_llm: true

llm:
  enabled: false
  base_url: "https://api-cn.smallice.xyz/v1"
  api_key_env: "OPENAI_API_KEY"
  model_name: "gpt-5.5"
  embedding_model_name: "text-embedding-v4"
  timeout_seconds: 30

embedding:
  provider: "qwen"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: "API_KEY"
  model_name: "text-embedding-v4"
  dimensions: 1024
  timeout_seconds: 30
learning:
  enabled: true
  evolution_enabled: false
  domain_knowledge_enabled: false
  l2_project_facts:
